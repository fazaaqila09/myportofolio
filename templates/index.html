<!DOCTYPE html>
{% load static %}
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Faza - Portfolio</title>

    <!-- Poppins untuk teks, Great Vibes untuk logo "Faza" -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&family=Great+Vibes&display=swap" rel="stylesheet">

    <!-- Ambil Ikon Logo dari FontAwesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <!-- Menghubungkan ke file CSS -->

    <!-- Navigasi Bar: logo kiri, menu kanan -->

        <a href="#home" class="nav-brand">Faza</a>
        <div class="nav-menu">

            <a href="#experience">Experience</a>

                        <a href="mailto:muhammadfazaaqila09@gmail.com" title="Email"><i class="fa-solid fa-envelope"></i></a>
                    </div>
                </div>
            </div>

            <div class="profile-photo">

            </div>

        </div>
