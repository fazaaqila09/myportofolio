<tr id="contact-{{ contact.id }}">
    <td>
        <input type="text" name="name" class="contacts-input" value="{{ contact.name }}" maxlength="100" required
            form="edit-form-{{ contact.id }}" aria-label="Name" data-i18n-attr="aria-label:contacts.name">
    </td>
    <td>
        <input type="email" name="email" class="contacts-input" value="{{ contact.email }}" required
            form="edit-form-{{ contact.id }}" aria-label="Email" data-i18n-attr="aria-label:contacts.email">
    </td>
    <td class="contacts-actions">
        <form id="edit-form-{{ contact.id }}"
            hx-put="{% url 'contacts:contact_update' contact.id %}"
            hx-target="#contact-{{ contact.id }}"
            hx-swap="outerHTML">
            <button type="submit" class="button" data-i18n="contacts.save">Save</button>
        </form>
        <button type="button" class="button button-secondary"
            hx-get="{% url 'contacts:contact_row' contact.id %}"
            hx-target="#contact-{{ contact.id }}"
            hx-swap="outerHTML"
            data-i18n="contacts.cancel">Cancel</button>
    </td>
</tr>
