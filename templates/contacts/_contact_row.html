<tr id="contact-{{ contact.id }}">
    <td>{{ contact.name }}</td>
    <td>{{ contact.email }}</td>
    <td class="contacts-actions">
        <button type="button" class="button button-danger"
            hx-delete="{% url 'contacts:contact_delete' contact.id %}"
            hx-target="closest tr"
            hx-swap="outerHTML"
            hx-confirm="Delete this contact?"
            data-i18n-attr="hx-confirm:contacts.delete.confirm"
            data-i18n="contacts.delete">Delete</button>
    </td>
</tr>
