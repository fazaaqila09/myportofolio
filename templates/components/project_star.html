<form method="post" action="{% url 'main:toggle_star' project.id %}" class="star-form">
    {% csrf_token %}
    <button type="submit"
        class="button button-star{% if user in project.starred_by.all %} is-starred{% endif %}"
        title="{% if project.starred_by.all %}Dibintangi oleh {{ project.starred_by.all|join:', ' }}{% else %}Jadilah yang pertama memberi star{% endif %}">
        <span aria-hidden="true">&#9733;</span>
        <span data-i18n="{% if user in project.starred_by.all %}star.unstar{% else %}star.star{% endif %}">{% if user in project.starred_by.all %}Unstar{% else %}Star{% endif %}</span>
        <span class="star-count">{{ project.starred_by.count }}</span>
    </button>
</form>
