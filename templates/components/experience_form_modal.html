<!-- Modal form Experience (dirender untuk pemilik dan Editor).
     Dipakai untuk dua mode oleh pages/experience.js:
     - tambah (pemilik)        -> POST  /api/v1/experience/
     - ubah (pemilik & Editor) -> PATCH /api/v1/experience/<id>/ (hanya field yang berubah) -->
<div id="experience-modal"
     class="project-form-modal exp-form-modal"
     popover="auto"
     role="dialog"
     aria-modal="true"
     aria-labelledby="experience-modal-title">
    <button type="button"
            class="project-form-modal__backdrop"
            popovertarget="experience-modal"
            popovertargetaction="hide"
            aria-label="Close form"
            data-i18n-attr="aria-label:exp.modal.close"></button>

    <div class="project-form-modal__content">
        <button type="button"
                class="project-form-modal__close"
                popovertarget="experience-modal"
                popovertargetaction="hide"
                aria-label="Close form"
                data-i18n-attr="aria-label:exp.modal.close">&times;</button>

        <h2 id="experience-modal-title" data-i18n="exp.modal.title">Add New Experience</h2>
        <form id="experience-form"
              method="post"
              class="project-form exp-modal-form"
              novalidate>
            {% csrf_token %}
            {% for field in form %}
                <div class="form-group" data-field="{{ field.name }}">
                    <label for="{{ field.id_for_label }}">{{ field.label }}{% if field.field.required %} <span class="req" aria-hidden="true">*</span>{% endif %}</label>
                    {{ field }}
                    <p class="form-error field-error" hidden></p>
                </div>
            {% endfor %}
            <div class="project-form-modal__actions">
                <button type="button"
                        class="button button-secondary"
                        popovertarget="experience-modal"
                        popovertargetaction="hide"
                        data-i18n="common.cancel">Cancel</button>
                <button type="submit" class="button exp-modal-submit">
                    <span id="experience-submit-label" data-i18n="exp.add">Add Experience</span>
                </button>
            </div>
        </form>
    </div>
</div>
