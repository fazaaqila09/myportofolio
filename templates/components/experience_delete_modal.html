<div id="delete-experience-{{ experience.id }}"
    class="delete-modal"
    popover="auto"
    role="dialog"
    aria-modal="true"
    aria-labelledby="delete-experience-title-{{ experience.id }}">
    <button type="button" class="delete-modal__backdrop"
        popovertarget="delete-experience-{{ experience.id }}" popovertargetaction="hide"
        aria-label="Close"></button>
    <div class="delete-modal__content">
        <button type="button" class="delete-modal__close"
            popovertarget="delete-experience-{{ experience.id }}" popovertargetaction="hide"
            aria-label="Close">&times;</button>
        <h2 id="delete-experience-title-{{ experience.id }}">Delete Experience?</h2>
        <p>Are you sure you want to delete <strong>{{ experience.title }}</strong>?</p>
        <form method="post" action="{% url 'main:delete_experience' experience.id %}">
            {% csrf_token %}
            <div class="form-group">
                <label for="secret-key-{{ experience.id }}">Access Code</label>
                <input type="password" id="secret-key-{{ experience.id }}" name="secret_key"
                    placeholder="Enter the access code" required>
            </div>
            <div class="delete-modal__actions">
                <button type="button" class="button button-secondary"
                    popovertarget="delete-experience-{{ experience.id }}" popovertargetaction="hide">Cancel</button>
                <button type="submit" class="button button-danger">Yes, Delete</button>
            </div>
        </form>
    </div>
</div>
